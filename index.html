<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control de Ventas - Fuente Nueva</title>

    <!-- Librerías de Terceros (CDN) -->
    <!-- Chart.js para gráficas -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- SheetJS (xlsx) para exportar a Excel -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <!-- Iconos (Feather Icons) -->
    <script src="https://cdn.jsdelivr.net/npm/feather-icons/dist/feather.min.js"></script>

    <style>
        /* --- CSS Moderno (style.css) --- */

        /* 1. Variables Globales y Reseteo */
        :root {
            --color-primary: #0a74da;
            --color-primary-dark: #085dab;
            --color-secondary: #10b981;
            --color-danger: #ef4444;
            --color-warning: #f59e0b;
            --color-bg-light: #f9fafb;
            --color-bg-white: #ffffff;
            --color-text-primary: #1f2937;
            --color-text-secondary: #6b7280;
            --color-border: #e5e7eb;
            --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
            --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1);
            --radius-md: 0.375rem;
            --radius-lg: 0.5rem;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: var(--color-bg-light); color: var(--color-text-primary); line-height: 1.5; }

        /* 2. Utilidades */
        .hidden { display: none !important; }

        /* 3. Pantalla de Carga */
        #loading-overlay {
            position: fixed; inset: 0; background-color: rgba(255, 255, 255, 0.9);
            display: flex; align-items: center; justify-content: center; z-index: 1000;
        }
        .spinner {
            width: 50px; height: 50px; border-radius: 50%;
            border: 5px solid var(--color-border); border-top-color: var(--color-primary);
            animation: spin 1s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* 4. Vista de Autenticación (CORREGIDO #auth-view) */
        #auth-view {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: var(--color-bg-light);
            padding: 1rem;
        }

        .auth-container {
            width: 100%; max-width: 400px;
            padding: 2rem; background-color: var(--color-bg-white);
            border-radius: var(--radius-lg); box-shadow: var(--shadow-lg);
        }

        .auth-tabs { display: flex; border-bottom: 1px solid var(--color-border); margin-bottom: 1.5rem; }
        .auth-tab {
            flex: 1; padding: 0.75rem; border: none; background: none;
            cursor: pointer; font-weight: 600; color: var(--color-text-secondary);
            border-bottom: 2px solid transparent;
        }
        .auth-tab.active { color: var(--color-primary); border-bottom-color: var(--color-primary); }

        .form-group { margin-bottom: 1rem; display: flex; flex-direction: column; }
        .form-group label { margin-bottom: 0.375rem; font-weight: 500; font-size: 0.875rem; }
        .form-input {
            padding: 0.75rem; border: 1px solid var(--color-border); border-radius: var(--radius-md);
            font-size: 1rem; width: 100%;
        }
        .form-input:focus { outline: none; border-color: var(--color-primary); }

        .btn {
            padding: 0.75rem 1.5rem; border: none; border-radius: var(--radius-md);
            font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 0.5rem;
            transition: all 0.2s;
        }
        .btn-primary { background-color: var(--color-primary); color: white; width: 100%; }
        .btn-primary:hover { background-color: var(--color-primary-dark); }
        .btn-secondary { background-color: white; border: 1px solid var(--color-border); color: var(--color-text-primary); }
        .btn-danger { background-color: var(--color-danger); color: white; }
        .btn-success { background-color: var(--color-secondary); color: white; }
        .btn-sm { padding: 0.4rem 0.8rem; font-size: 0.875rem; width: auto; }

        #auth-error {
            margin-top: 1rem; padding: 0.75rem; background-color: #fee2e2;
            color: #b91c1c; border-radius: var(--radius-md); text-align: center; font-size: 0.875rem;
        }
        #app-message {
            position: fixed; bottom: 20px; right: 20px; padding: 1rem;
            border-radius: var(--radius-md); color: white; z-index: 2000;
        }

        /* 5. Vista Principal */
        #app-header {
            background-color: white; border-bottom: 1px solid var(--color-border);
            padding: 0.75rem 1.5rem; display: flex; align-items: center; justify-content: space-between;
            position: sticky; top: 0; z-index: 500;
        }
        .app-title { font-size: 1.25rem; font-weight: 700; color: var(--color-primary); }
        .nav-link {
            padding: 0.5rem 1rem; text-decoration: none; color: var(--color-text-secondary);
            font-weight: 500; border-radius: var(--radius-md); margin-left: 0.5rem;
        }
        .nav-link.active { background-color: var(--color-primary); color: white; }
        .nav-link:hover:not(.active) { background-color: var(--color-bg-light); }

        #app-main { padding: 2rem; max-width: 1200px; margin: 0 auto; }
        .card { background: white; padding: 1.5rem; border-radius: var(--radius-lg); box-shadow: var(--shadow-sm); margin-bottom: 1.5rem; }
        .card-header { font-size: 1.1rem; font-weight: 700; margin-bottom: 1rem; display: flex; justify-content: space-between; align-items: center; }

        /* Grid y Tablas */
        .grid-4 { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem; }
        .stat-card { display: flex; align-items: center; gap: 1rem; }
        .stat-icon { width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: white; }
        .bg-blue { background: var(--color-primary); }
        .bg-green { background: var(--color-secondary); }
        .bg-yellow { background: var(--color-warning); }
        .bg-red { background: var(--color-danger); }

        .table-responsive { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; min-width: 600px; }
        th, td { padding: 0.75rem; text-align: left; border-bottom: 1px solid var(--color-border); }
        th { background-color: var(--color-bg-light); font-weight: 600; font-size: 0.85rem; text-transform: uppercase; color: var(--color-text-secondary); }

        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
        
        @media (max-width: 768px) {
            .form-row { grid-template-columns: 1fr; }
            #app-header { flex-direction: column; gap: 1rem; align-items: flex-start; }
            .header-right { width: 100%; display: flex; justify-content: space-between; align-items: center; }
            #app-nav { width: 100%; display: flex; overflow-x: auto; padding-bottom: 5px; }
        }
    </style>
</head>
<body>

    <!-- Overlay de Carga -->
    <div id="loading-overlay" class="hidden"><div class="spinner"></div></div>
    <!-- Mensajes Flotantes -->
    <div id="app-message" class="hidden"></div>

    <!-- VISTA: Autenticación -->
    <div id="auth-view">
        <div class="auth-container">
            <h2 style="text-align: center; margin-bottom: 1rem; color: var(--color-primary);">Fuente Nueva</h2>
            <div class="auth-tabs">
                <button id="login-tab-btn" class="auth-tab active">Iniciar Sesión</button>
                <button id="register-tab-btn" class="auth-tab">Registro</button>
            </div>

            <!-- Login -->
            <form id="login-form">
                <div class="form-group">
                    <label>Correo Electrónico</label>
                    <input type="email" id="login-email" class="form-input" placeholder="ejemplo@correo.com" required>
                </div>
                <div class="form-group">
                    <label>Contraseña</label>
                    <input type="password" id="login-password" class="form-input" placeholder="******" required>
                </div>
                <button type="submit" class="btn btn-primary">Entrar</button>
            </form>

            <!-- Registro -->
            <form id="register-form" class="hidden">
                <div class="form-group">
                    <label>Correo Electrónico</label>
                    <input type="email" id="register-email" class="form-input" required>
                </div>
                <div class="form-group">
                    <label>Contraseña</label>
                    <input type="password" id="register-password" class="form-input" placeholder="Mínimo 6 caracteres" minlength="6" required>
                </div>
                <div class="form-group">
                    <label>Rol</label>
                    <select id="register-role" class="form-input">
                        <option value="vendedor">Vendedor</option>
                        <option value="admin">Administrador</option>
                    </select>
                </div>
                <button type="submit" class="btn btn-primary">Crear Cuenta</button>
            </form>

            <div id="auth-error" class="hidden"></div>
        </div>
    </div>

    <!-- VISTA: Aplicación Principal -->
    <div id="app-view" class="hidden">
        <header id="app-header">
            <div class="header-left">
                <div class="app-title">Sistema Fuente Nueva</div>
                <nav id="app-nav" style="display: inline-flex; margin-left: 1rem;">
                    <a href="#" class="nav-link active" data-page="page-dashboard">Dashboard</a>
                    <a href="#" class="nav-link" data-page="page-sales">Ventas</a>
                    <a href="#" class="nav-link" data-page="page-products">Productos</a>
                </nav>
            </div>
            <div class="header-right">
                <span id="user-display" style="font-size: 0.9rem; margin-right: 1rem; color: #555;"></span>
                <button id="logout-btn" class="btn btn-sm btn-secondary">
                    <i data-feather="log-out"></i> Salir
                </button>
            </div>
        </header>

        <main id="app-main">
            <!-- PÁGINA: Dashboard -->
            <div id="page-dashboard" class="app-page">
                <div class="grid-4">
                    <div class="card stat-card">
                        <div class="stat-icon bg-blue"><i data-feather="dollar-sign"></i></div>
                        <div><small>Ventas Hoy</small><h3 id="stat-today">$0.00</h3></div>
                    </div>
                    <div class="card stat-card">
                        <div class="stat-icon bg-green"><i data-feather="bar-chart"></i></div>
                        <div><small>Semana</small><h3 id="stat-week">$0.00</h3></div>
                    </div>
                    <div class="card stat-card">
                        <div class="stat-icon bg-red"><i data-feather="box"></i></div>
                        <div><small>Stock Total</small><h3 id="stat-stock">0</h3></div>
                    </div>
                </div>
                <div class="card">
                    <div class="card-header">Tendencia de Ventas (7 días)</div>
                    <div style="height: 300px;"><canvas id="sales-chart"></canvas></div>
                </div>
            </div>

            <!-- PÁGINA: Ventas -->
            <div id="page-sales" class="app-page hidden">
                <div class="card">
                    <div class="card-header">Nueva Venta</div>
                    <form id="sale-form">
                        <div class="form-row">
                            <div class="form-group">
                                <label>Producto</label>
                                <select id="sale-product-select" class="form-input" required></select>
                            </div>
                            <div class="form-group">
                                <label>Cantidad</label>
                                <input type="number" id="sale-quantity" class="form-input" value="1" min="1" required>
                            </div>
                        </div>
                        <div class="form-row">
                            <div class="form-group"><label>Precio Unitario</label><div id="sale-price-display" class="form-input" style="background:#eee;">$0.00</div></div>
                            <div class="form-group"><label>Total</label><div id="sale-total-display" class="form-input" style="background:#eee; font-weight:bold;">$0.00</div></div>
                        </div>
                        <button type="submit" class="btn btn-success"><i data-feather="shopping-cart"></i> Registrar Venta</button>
                    </form>
                </div>
                <div class="card">
                    <div class="card-header">
                        Historial Reciente
                        <button id="export-btn" class="btn btn-sm btn-success"><i data-feather="download"></i> Excel</button>
                    </div>
                    <div class="table-responsive">
                        <table>
                            <thead><tr><th>Fecha</th><th>Producto</th><th>Cant.</th><th>Total</th><th>Vendedor</th></tr></thead>
                            <tbody id="sales-table-body"></tbody>
                        </table>
                    </div>
                </div>
            </div>

            <!-- PÁGINA: Productos -->
            <div id="page-products" class="app-page hidden">
                <div class="card">
                    <div class="card-header" id="product-form-title">Agregar Producto</div>
                    <form id="product-form">
                        <input type="hidden" id="product-id">
                        <div class="form-row">
                            <div class="form-group"><label>Nombre</label><input type="text" id="product-name" class="form-input" required></div>
                            <div class="form-group"><label>Precio ($)</label><input type="number" id="product-price" class="form-input" step="0.01" required></div>
                        </div>
                        <div class="form-group"><label>Stock Inicial</label><input type="number" id="product-stock" class="form-input" required></div>
                        <div style="display:flex; gap:1rem;">
                            <button type="submit" class="btn btn-primary">Guardar</button>
                            <button type="button" id="clear-product-btn" class="btn btn-secondary">Limpiar</button>
                        </div>
                    </form>
                </div>
                <div class="card">
                    <div class="table-responsive">
                        <table>
                            <thead><tr><th>Producto</th><th>Precio</th><th>Stock</th><th>Acciones</th></tr></thead>
                            <tbody id="products-table-body"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- LÓGICA DE JAVASCRIPT Y FIREBASE -->
    <script type="module">
        // Importamos desde una versión ESTABLE (10.8.0) para asegurar compatibilidad
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, collection, doc, setDoc, addDoc, updateDoc, deleteDoc, onSnapshot, query, orderBy, serverTimestamp, runTransaction } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // --- TUS CLAVES CONFIGURADAS CORRECTAMENTE ---
        const firebaseConfig = {
            apiKey: "AIzaSyB2KV65ZhUEZbjn14hF3cWsr8d4kzLsYPk",
            authDomain: "fuente-nueva.firebaseapp.com",
            projectId: "fuente-nueva",
            storageBucket: "fuente-nueva.firebasestorage.app",
            messagingSenderId: "256396830278",
            appId: "1:256396830278:web:0d9cff310705e52bb20c47",
            measurementId: "G-8NGS5XH8K6"
        };

        // Inicializar Firebase
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // Variables de Estado
        let currentUser = null;
        let products = [];
        let sales = [];
        let chartInstance = null;

        // Referencias DOM
        const views = {
            auth: document.getElementById('auth-view'),
            app: document.getElementById('app-view'),
            loading: document.getElementById('loading-overlay')
        };
        const authMsg = document.getElementById('auth-error');
        
        // --- AUTENTICACIÓN ---
        
        // Listener de Estado de Usuario
        onAuthStateChanged(auth, (user) => {
            currentUser = user;
            views.loading.classList.add('hidden');
            if (user) {
                views.auth.classList.add('hidden');
                views.app.classList.remove('hidden');
                document.getElementById('user-display').textContent = user.email;
                initApp(); // Cargar datos
            } else {
                views.app.classList.add('hidden');
                views.auth.classList.remove('hidden');
                authMsg.classList.add('hidden');
            }
        });

        // Login
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            views.loading.classList.remove('hidden');
            try {
                await signInWithEmailAndPassword(auth, document.getElementById('login-email').value, document.getElementById('login-password').value);
            } catch (err) {
                views.loading.classList.add('hidden');
                showError("Error: Credenciales incorrectas o usuario no encontrado.");
                console.error(err);
            }
        });

        // Registro
        document.getElementById('register-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            views.loading.classList.remove('hidden');
            const email = document.getElementById('register-email').value;
            const pass = document.getElementById('register-password').value;
            const role = document.getElementById('register-role').value;

            try {
                const cred = await createUserWithEmailAndPassword(auth, email, pass);
                // Guardar rol en Firestore
                await setDoc(doc(db, "users", cred.user.uid), {
                    email: email, role: role, createdAt: serverTimestamp()
                });
            } catch (err) {
                views.loading.classList.add('hidden');
                showError("Error al registrar: " + err.message);
            }
        });

        // Logout
        document.getElementById('logout-btn').addEventListener('click', () => signOut(auth));

        // Tabs Auth
        document.getElementById('login-tab-btn').addEventListener('click', (e) => switchAuthTab(e, 'login'));
        document.getElementById('register-tab-btn').addEventListener('click', (e) => switchAuthTab(e, 'register'));

        function switchAuthTab(e, mode) {
            document.querySelectorAll('.auth-tab').forEach(t => t.classList.remove('active'));
            e.target.classList.add('active');
            if(mode === 'login') {
                document.getElementById('login-form').classList.remove('hidden');
                document.getElementById('register-form').classList.add('hidden');
            } else {
                document.getElementById('login-form').classList.add('hidden');
                document.getElementById('register-form').classList.remove('hidden');
            }
            authMsg.classList.add('hidden');
        }

        function showError(msg) {
            authMsg.textContent = msg;
            authMsg.classList.remove('hidden');
        }

        // --- LÓGICA DE LA APP ---

        function initApp() {
            feather.replace();
            setupNavigation();
            listenProducts();
            listenSales();
        }

        function setupNavigation() {
            const links = document.querySelectorAll('.nav-link');
            links.forEach(link => {
                link.addEventListener('click', (e) => {
                    e.preventDefault();
                    links.forEach(l => l.classList.remove('active'));
                    e.target.classList.add('active');
                    document.querySelectorAll('.app-page').forEach(p => p.classList.add('hidden'));
                    document.getElementById(e.target.dataset.page).classList.remove('hidden');
                });
            });
        }

        // --- PRODUCTOS ---
        function listenProducts() {
            onSnapshot(query(collection(db, "products"), orderBy("name")), (snap) => {
                products = [];
                const tbody = document.getElementById('products-table-body');
                const select = document.getElementById('sale-product-select');
                tbody.innerHTML = '';
                select.innerHTML = '<option value="">-- Seleccionar --</option>';
                
                let totalStock = 0;

                snap.forEach(docSnap => {
                    const p = { id: docSnap.id, ...docSnap.data() };
                    products.push(p);
                    totalStock += (parseInt(p.stock) || 0);

                    // Tabla
                    tbody.innerHTML += `
                        <tr>
                            <td>${p.name}</td>
                            <td>$${parseFloat(p.price).toFixed(2)}</td>
                            <td>${p.stock}</td>
                            <td>
                                <button class="btn-sm btn-secondary" onclick="editProduct('${p.id}')">✏️</button>
                                <button class="btn-sm btn-danger" onclick="deleteProduct('${p.id}')">🗑️</button>
                            </td>
                        </tr>`;
                    
                    // Select Venta
                    if(p.stock > 0) {
                        select.innerHTML += `<option value="${p.id}">${p.name} ($${p.price})</option>`;
                    }
                });
                document.getElementById('stat-stock').textContent = totalStock;
                
                // Asignar eventos dinámicos a botones creados
                assignProductActions();
            });
        }

        // Guardar Producto
        document.getElementById('product-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const id = document.getElementById('product-id').value;
            const data = {
                name: document.getElementById('product-name').value,
                price: parseFloat(document.getElementById('product-price').value),
                stock: parseInt(document.getElementById('product-stock').value)
            };

            try {
                if(id) await updateDoc(doc(db, "products", id), data);
                else await addDoc(collection(db, "products"), { ...data, createdAt: serverTimestamp() });
                
                e.target.reset();
                document.getElementById('product-id').value = "";
                document.getElementById('product-form-title').textContent = "Agregar Producto";
                alert("Producto guardado");
            } catch(err) { alert("Error: " + err.message); }
        });

        // Helper para botones dinámicos
        window.editProduct = (id) => {
            const p = products.find(x => x.id === id);
            if(!p) return;
            document.getElementById('product-id').value = p.id;
            document.getElementById('product-name').value = p.name;
            document.getElementById('product-price').value = p.price;
            document.getElementById('product-stock').value = p.stock;
            document.getElementById('product-form-title').textContent = "Editar Producto";
            // Cambiar a tab productos si no estamos ahí (simple hack)
            document.querySelector('[data-page="page-products"]').click();
        };

        window.deleteProduct = async (id) => {
            if(confirm("¿Eliminar producto?")) {
                await deleteDoc(doc(db, "products", id));
            }
        };

        function assignProductActions() {
            // Necesario porque los botones se crean dinámicamente en el HTML string
            // Usamos funciones globales window.editProduct por simplicidad en este ejemplo de 1 archivo
        }
        
        document.getElementById('clear-product-btn').addEventListener('click', () => {
            document.getElementById('product-form').reset();
            document.getElementById('product-id').value = "";
            document.getElementById('product-form-title').textContent = "Agregar Producto";
        });

        // --- VENTAS ---
        
        // Actualizar formulario de venta
        const saleSelect = document.getElementById('sale-product-select');
        const saleQty = document.getElementById('sale-quantity');
        
        function updateSaleTotals() {
            const pid = saleSelect.value;
            const p = products.find(x => x.id === pid);
            const qty = parseInt(saleQty.value) || 1;
            
            if(p) {
                document.getElementById('sale-price-display').textContent = `$${p.price}`;
                document.getElementById('sale-total-display').textContent = `$${(p.price * qty).toFixed(2)}`;
            } else {
                document.getElementById('sale-price-display').textContent = "$0.00";
                document.getElementById('sale-total-display').textContent = "$0.00";
            }
        }
        saleSelect.addEventListener('change', updateSaleTotals);
        saleQty.addEventListener('input', updateSaleTotals);

        // Registrar Venta
        document.getElementById('sale-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const pid = saleSelect.value;
            const qty = parseInt(saleQty.value);
            const p = products.find(x => x.id === pid);

            if(!p || qty > p.stock) {
                alert("Stock insuficiente o producto inválido");
                return;
            }

            try {
                await runTransaction(db, async (transaction) => {
                    const pRef = doc(db, "products", pid);
                    const pDoc = await transaction.get(pRef);
                    if(!pDoc.exists()) throw "Producto no existe";
                    
                    const newStock = pDoc.data().stock - qty;
                    if(newStock < 0) throw "Stock insuficiente";

                    transaction.update(pRef, { stock: newStock });
                    const saleRef = doc(collection(db, "sales"));
                    transaction.set(saleRef, {
                        product: p.name,
                        price: p.price,
                        qty: qty,
                        total: p.price * qty,
                        seller: currentUser.email,
                        date: serverTimestamp()
                    });
                });
                e.target.reset();
                updateSaleTotals();
                alert("Venta registrada!");
            } catch(err) {
                alert("Error venta: " + err);
            }
        });

        function listenSales() {
            onSnapshot(query(collection(db, "sales"), orderBy("date", "desc")), (snap) => {
                sales = [];
                const tbody = document.getElementById('sales-table-body');
                tbody.innerHTML = '';
                
                let today = 0, week = 0;
                const now = new Date();

                snap.forEach(d => {
                    const s = d.data();
                    sales.push(s);
                    const date = s.date ? s.date.toDate() : new Date();
                    
                    // Stats
                    if(date.toDateString() === now.toDateString()) today += s.total;
                    const diffTime = Math.abs(now - date);
                    const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24)); 
                    if(diffDays <= 7) week += s.total;

                    // Tabla HTML
                    tbody.innerHTML += `
                        <tr>
                            <td>${date.toLocaleDateString()}</td>
                            <td>${s.product}</td>
                            <td>${s.qty}</td>
                            <td>$${s.total.toFixed(2)}</td>
                            <td>${s.seller}</td>
                        </tr>
                    `;
                });

                document.getElementById('stat-today').textContent = `$${today.toFixed(2)}`;
                document.getElementById('stat-week').textContent = `$${week.toFixed(2)}`;
                updateChart();
            });
        }

        // Gráfica
        function updateChart() {
            const ctx = document.getElementById('sales-chart').getContext('2d');
            
            // Agrupar por días (últimos 7)
            const labels = [];
            const data = [];
            for(let i=6; i>=0; i--) {
                const d = new Date();
                d.setDate(d.getDate() - i);
                const dateStr = d.toLocaleDateString();
                labels.push(dateStr);
                
                // Sumar ventas de ese día
                const total = sales
                    .filter(s => s.date && s.date.toDate().toLocaleDateString() === dateStr)
                    .reduce((sum, s) => sum + s.total, 0);
                data.push(total);
            }

            if(chartInstance) chartInstance.destroy();
            chartInstance = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'Ventas ($)',
                        data: data,
                        borderColor: '#0a74da',
                        tension: 0.3,
                        fill: true,
                        backgroundColor: 'rgba(10, 116, 218, 0.1)'
                    }]
                },
                options: { responsive: true, maintainAspectRatio: false }
            });
        }

        // Exportar Excel
        document.getElementById('export-btn').addEventListener('click', () => {
            const data = sales.map(s => ({
                Fecha: s.date ? s.date.toDate().toLocaleString() : '',
                Producto: s.product,
                Cantidad: s.qty,
                Total: s.total,
                Vendedor: s.seller
            }));
            const ws = XLSX.utils.json_to_sheet(data);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "Ventas");
            XLSX.writeFile(wb, "Reporte_Ventas.xlsx");
        });

    </script>
</body>
</html>
