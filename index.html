<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fuente Nueva | ERP</title>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/feather-icons/dist/feather.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            /* Paleta Elegante de Azules */
            --primary: #2563eb;       /* Azul Brillante */
            --primary-dark: #1e3a8a;  /* Azul Marino Profundo */
            --primary-light: #eff6ff; /* Azul Hielo (Fondos) */
            --accent: #0ea5e9;        /* Celeste (Botones acción) */
            
            --success: #10b981;       /* Verde Esmeralda */
            --danger: #ef4444;        /* Rojo Suave */
            --warning: #f59e0b;       /* Ámbar */
            
            --bg-body: #f3f4f6;
            --surface: #ffffff;
            --text-main: #1f2937;
            --text-muted: #6b7280;
            
            --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
            --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
            --radius: 12px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        
        body { background-color: var(--bg-body); color: var(--text-main); font-size: 14px; }
        
        /* Utilidades */
        .hidden { display: none !important; }
        .flex { display: flex; }
        .flex-col { flex-direction: column; }
        .items-center { align-items: center; }
        .justify-between { justify-content: space-between; }
        .admin-only { display: none; } 
        
        /* Textos */
        .text-red { color: var(--danger); font-weight: 600; }
        .text-green { color: var(--success); font-weight: 600; }
        .text-blue { color: var(--primary); font-weight: 700; }
        .text-gray { color: var(--text-muted); }

        /* HEADER ELEGANTE */
        header { 
            background: linear-gradient(135deg, var(--primary-dark) 0%, var(--primary) 100%);
            padding: 1rem 2rem; 
            box-shadow: var(--shadow-md); 
            position: sticky; top: 0; z-index: 100; 
            color: white;
        }
        
        .header-content { max-width: 1400px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1rem; }
        .logo { font-size: 1.5rem; font-weight: 700; display: flex; align-items: center; gap: 10px; letter-spacing: -0.5px; }
        
        nav { display: flex; gap: 0.5rem; overflow-x: auto; padding-bottom: 5px; }
        nav::-webkit-scrollbar { height: 0px; }
        
        nav a { 
            text-decoration: none; color: rgba(255,255,255,0.7); 
            font-weight: 500; padding: 0.6rem 1.2rem; 
            border-radius: 50px; transition: all 0.3s ease; 
            white-space: nowrap; font-size: 0.9rem;
        }
        nav a:hover { background: rgba(255,255,255,0.1); color: white; }
        nav a.active { background: white; color: var(--primary); font-weight: 700; box-shadow: var(--shadow-sm); }

        /* CONTENEDOR PRINCIPAL */
        main { padding: 2rem; max-width: 1400px; margin: 0 auto; width: 100%; animation: fadeIn 0.5s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* TARJETAS */
        .card { 
            background: var(--surface); 
            padding: 1.5rem; 
            border-radius: var(--radius); 
            box-shadow: var(--shadow-md); 
            margin-bottom: 1.5rem; 
            border: 1px solid rgba(0,0,0,0.05);
            transition: transform 0.2s;
        }
        .card:hover { transform: translateY(-2px); }
        .grid-4 { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 1.5rem; }

        /* FORMULARIOS */
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-bottom: 1rem; }
        
        label { font-size: 0.8rem; font-weight: 600; color: var(--text-muted); margin-bottom: 0.4rem; display: block; text-transform: uppercase; letter-spacing: 0.5px; }
        
        input, select, textarea { 
            width: 100%; padding: 0.8rem; 
            border: 1px solid #e5e7eb; 
            border-radius: 8px; 
            margin-bottom: 1rem; 
            font-size: 0.95rem; 
            background: #f9fafb;
            transition: border 0.2s, box-shadow 0.2s;
        }
        input:focus, select:focus, textarea:focus { 
            outline: none; border-color: var(--primary); 
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1); 
            background: white;
        }

        /* BOTONES */
        .btn { 
            padding: 0.8rem 1.5rem; border: none; border-radius: 8px; 
            cursor: pointer; font-weight: 600; color: white; 
            display: inline-flex; gap: 0.5rem; align-items: center; justify-content: center; 
            transition: all 0.2s; letter-spacing: 0.3px;
        }
        .btn:active { transform: scale(0.98); }
        .btn-sm { padding: 0.4rem 0.8rem; font-size: 0.8rem; border-radius: 6px; }
        
        .btn-blue { background: linear-gradient(135deg, var(--primary), var(--accent)); box-shadow: 0 4px 6px rgba(37, 99, 235, 0.2); }
        .btn-blue:hover { filter: brightness(1.1); }
        
        .btn-green { background: linear-gradient(135deg, #059669, #10b981); box-shadow: 0 4px 6px rgba(16, 185, 129, 0.2); }
        .btn-green:hover { filter: brightness(1.1); }
        
        .btn-red { background: linear-gradient(135deg, #dc2626, #ef4444); box-shadow: 0 4px 6px rgba(239, 68, 68, 0.2); }
        
        .btn-gray { background: #e5e7eb; color: var(--text-main); }
        .btn-gray:hover { background: #d1d5db; }

        /* TABLAS */
        .table-container { overflow-x: auto; border-radius: 8px; border: 1px solid #e5e7eb; }
        table { width: 100%; border-collapse: collapse; background: white; }
        th, td { padding: 1rem; text-align: left; border-bottom: 1px solid #f3f4f6; white-space: nowrap; }
        th { background: #f8fafc; font-size: 0.75rem; text-transform: uppercase; color: var(--text-muted); font-weight: 700; letter-spacing: 0.5px; }
        tr:hover { background-color: #f8fafc; }

        /* LOGIN */
        .auth-bg { 
            position: fixed; inset: 0; 
            background: linear-gradient(135deg, #1e3a8a 0%, #3b82f6 100%); 
            display: flex; align-items: center; justify-content: center; z-index: 2000;
        }
        .auth-box { 
            width: 100%; max-width: 420px; 
            background: white; padding: 2.5rem; 
            border-radius: 20px; 
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04); 
        }

        /* SPINNER */
        #loader { position: fixed; inset: 0; background: rgba(255,255,255,0.95); display: flex; justify-content: center; align-items: center; z-index: 3000; }
        .spin { width: 50px; height: 50px; border: 4px solid #e5e7eb; border-top-color: var(--primary); border-radius: 50%; animation: spin 0.8s infinite linear; }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* Modal */
        .modal-overlay { position: fixed; inset: 0; background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(4px); display: flex; align-items: center; justify-content: center; z-index: 3000; }
        .modal-content { background: white; padding: 2rem; border-radius: 16px; width: 90%; max-width: 450px; box-shadow: var(--shadow-md); animation: slideUp 0.3s ease; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        @media(max-width: 768px) { .form-grid { grid-template-columns: 1fr; } header { padding: 1rem; } }
    </style>
</head>
<body>

    <div id="loader" class="hidden"><div class="spin"></div></div>
    <div id="toast" style="position:fixed; bottom:20px; right:20px; padding:1rem 1.5rem; background:#1e293b; color:white; border-radius:8px; display:none; z-index:4000; box-shadow: var(--shadow-md);"></div>

    <div id="modal-confirm" class="modal-overlay hidden">
        <div class="modal-content" style="text-align: center;">
            <div style="background: #fee2e2; width: 60px; height: 60px; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 1rem auto; color: var(--danger);">
                <i data-feather="alert-circle" width="32" height="32"></i>
            </div>
            <h3 id="confirm-title" style="margin-bottom:0.5rem; font-size: 1.25rem;">Confirmar</h3>
            <p id="confirm-msg" style="color:var(--text-muted); margin-bottom:1.5rem; line-height: 1.5;"></p>
            <div class="modal-actions">
                <button onclick="closeConfirm()" class="btn btn-gray" style="flex:1">Cancelar</button>
                <button id="confirm-yes-btn" class="btn btn-blue" style="flex:1">Confirmar</button>
            </div>
        </div>
    </div>

    <div id="modal-restock" class="modal-overlay hidden">
        <div class="modal-content">
            <h3 style="margin-bottom: 0.5rem; display:flex; align-items:center; gap:10px;"><i data-feather="package"></i> Entrada Inventario</h3>
            <p style="color:var(--text-muted); margin-bottom: 1.5rem; font-size:0.9rem;">Producto: <b id="modal-prod-name" class="text-blue"></b></p>
            <form id="form-restock">
                <input type="hidden" id="restock-id">
                <input type="hidden" id="restock-type">
                <label>Cantidad a Ingresar</label>
                <input type="number" id="restock-qty" min="1" placeholder="0" required style="font-size:1.2rem; border-color: var(--primary);">
                <div class="modal-actions">
                    <button type="button" onclick="closeModal()" class="btn btn-gray" style="flex:1">Cancelar</button>
                    <button type="submit" class="btn btn-green" style="flex:1">Guardar Entrada</button>
                </div>
            </form>
        </div>
    </div>

    <div id="auth-view" class="auth-bg">
        <div class="auth-box">
            <div style="text-align: center; margin-bottom: 2rem;">
                <h1 style="color:var(--primary-dark); font-size: 1.8rem; margin-bottom
